[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello"
version = "0.1.0"
description = "Prints a greeting from a template"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hello = "hello:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hello"]
